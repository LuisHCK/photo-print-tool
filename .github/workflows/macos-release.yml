name: macOS Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Derive app version from tag
        id: version
        shell: bash
        run: |
          raw="${GITHUB_REF_NAME#v}"
          if [[ "$raw" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "value=$raw" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal app and DMG
        env:
          PHOTO_PRINT_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/build-desktop.sh

      - name: Rename DMG with version
        id: dmg
        shell: bash
        run: |
          dmg="desktop/build/PhotoPrintTool-${{ steps.version.outputs.value }}.dmg"
          mv desktop/build/PhotoPrintTool.dmg "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPrintTool-${{ github.ref_name }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" \
              --title "Photo Print Tool $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
